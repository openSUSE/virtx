# Configuration of virtxd on this host, /etc/virtx/virtxd.conf.
#
# This file is about the host it is installed on.  The settings the whole
# cluster has to agree on are the cluster policy instead, which lives on the
# shared registration tree as /vms/reg/cluster_policy: see the example in
# etc/virtx/cluster_policy, and pkg/policy for how it is read and kept.
#
# The syntax is one "setting = value" per line, a # starts a comment, blank
# lines are ignored and a value may be quoted.  A setting this file does not
# mention keeps the value documented below, and a line that cannot be used only
# adds a warning: virtxd has to come up even on a host whose configuration is
# wrong.  The startup log prints every setting with the layer its value came
# from, the file, the command line or the default.
#
# isolation_ping_timeout_seconds is how long one ping to one isolation address
# may take before that address counts as unanswered.  It has to stay well below
# the pace at which the hosts publish what they see, or a slow network looks
# like a broken one; the addresses themselves are part of the cluster policy.
# Default 1.
isolation_ping_timeout_seconds = 1
#
# sanlock_cmd_timeout_seconds is how long one sanlock command may take before it
# is given up on.  It talks to the shared storage, so it has to be long enough
# for a healthy disk to answer and short enough that a host which lost its
# storage is declared dead soon after.  Default 3.
sanlock_cmd_timeout_seconds = 3
#
# hastate_round_budget_seconds is how long one round of publishing this host's
# own report and reading the reports of the other hosts may take in total.  A
# round that runs out of budget keeps what it has and leaves the rest to the
# next one, so that one slow peer cannot hold up every round.  Default 3.
hastate_round_budget_seconds = 3
